<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Energy Orbs Number Line</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Drag the energy coins into the orbs</h1>

    <!-- Number line -->
    <div class="number-line">
      <div id="marker">0</div>
    </div>

    <div class="row">
      <!-- Negatives on the left -->
      <div class="panel">
        <div class="tray" id="negTray"></div>
        <div class="tray-label">Negative Energy (red)</div>
      </div>

      <!-- Orbs in the center -->
      <div class="orbs">
        <div class="orb negative" id="negOrb">
          <div class="count" id="negCount">0</div>
          <div class="orb-label">Negative Orb</div>
        </div>

        <div class="orb positive" id="posOrb">
          <div class="count" id="posCount">0</div>
          <div class="orb-label">Positive Orb</div>
        </div>
      </div>

      <!-- Positives on the right -->
      <div class="panel">
        <div class="tray" id="posTray"></div>
        <div class="tray-label">Positive Energy (green)</div>
      </div>
    </div>

    <div class="controls">
      <div id="totalBox">Net Energy: <span id="net">0</span></div>
      <div class="tip">Tip: drag or tap a coin then drop it onto an orb.</div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
